name: NeuroStore Multi-Platform Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags (e.g. v0.4.0)

jobs:
  build-release:
    name: Build & Release Node
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: neuro-node-linux-x86_64
            executable: neuro-node
          - os: macos-latest
            target: aarch64-apple-darwin # Apple Silicon M1/M2/M3
            artifact_name: neuro-node-macos-arm64
            executable: neuro-node
          - os: macos-latest
            target: x86_64-apple-darwin # Intel Mac
            artifact_name: neuro-node-macos-x86_64
            executable: neuro-node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: neuro-node-windows-x86_64
            executable: neuro-node.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare signed node build identity
        shell: pwsh
        env:
          NODE_BINARY_SIGNING_SECRET: ${{ secrets.NODE_BINARY_SIGNING_SECRET }}
        run: |
          .\scripts\prepare-node-build-signature.ps1 `
            -Target "${{ matrix.target }}" `
            -Package "neuro-node" `
            -Version "${{ github.ref_name }}" `
            -GitSha "${{ github.sha }}" `
            -ArtifactName "${{ matrix.artifact_name }}" `
            -JsonOut "release_bundle/${{ matrix.artifact_name }}.build.json"

      - name: Build Physical Node Daemon
        run: cargo build -p neuronode --release --target ${{ matrix.target }}

      - name: Package Bundle (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release_bundle
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} release_bundle/neuro-node
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp deploy/systemd/install-node-service.sh release_bundle/install-node-service.sh
            cp deploy/systemd/uninstall-node-service.sh release_bundle/uninstall-node-service.sh
            cp deploy/systemd/neuro-node.service release_bundle/neuro-node.service
          else
            cp deploy/launchd/install-node-service.sh release_bundle/install-node-service.sh
            cp deploy/launchd/uninstall-node-service.sh release_bundle/uninstall-node-service.sh
            cp deploy/launchd/com.neurostore.node.plist release_bundle/com.neurostore.node.plist
          fi
          chmod +x release_bundle/neuro-node release_bundle/install-node-service.sh release_bundle/uninstall-node-service.sh
          sha256sum release_bundle/neuro-node > release_bundle/${{ matrix.artifact_name }}.sha256
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C release_bundle .

      - name: Package Bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_bundle -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.executable }} release_bundle/
          $hash = (Get-FileHash -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          $hash  ${{ matrix.executable }}
          "@ | Set-Content -Path "release_bundle/${{ matrix.artifact_name }}.sha256"
          Compress-Archive -Path release_bundle/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

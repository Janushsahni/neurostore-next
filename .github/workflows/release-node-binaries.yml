name: Release Cross-Platform Node Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: neuro-node
            asset_name: neuro-node-macos-arm64.tar.gz
            bundle_name: neuro-node-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: neuro-node
            asset_name: neuro-node-linux-x86_64.tar.gz
            bundle_name: neuro-node-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: neuro-node.exe
            asset_name: NeuroStore-Node.exe
            bundle_name: neuro-node-windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare signed node build identity
        shell: pwsh
        env:
          NODE_BINARY_SIGNING_SECRET: ${{ secrets.NODE_BINARY_SIGNING_SECRET }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if ("${env:NODE_BINARY_SIGNING_SECRET}" -ne "") {
            .\scripts\prepare-node-build-signature.ps1 `
              -Target "${{ matrix.target }}" `
              -Package "neuro-node" `
              -Version "${{ github.ref_name }}" `
              -GitSha "${{ github.sha }}" `
              -ArtifactName "${{ matrix.bundle_name }}" `
              -JsonOut "dist/${{ matrix.bundle_name }}.build.json"
          } else {
            "No signing secret, skipping extended identity signing."
            "{}" | Set-Content -Path "dist/${{ matrix.bundle_name }}.build.json"
          }

      - name: Build neuro-node binary
        run: cargo build --release -p neuronode --target ${{ matrix.target }}

      - name: Bundle assets
        shell: pwsh
        run: |
          if ("${{ matrix.os }}" -eq "windows-latest") {
            # Windows: Just the single renamed EXE for the seamless experience
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"
          } else {
            # MacOS/Linux: Bundle with install scripts
            $bundleDir = "dist/release_bundle"
            New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$bundleDir/neuro-node"
            
            if ("${{ matrix.os }}" -eq "ubuntu-latest") {
              Copy-Item "deploy/systemd/install-node-service.sh" "$bundleDir/"
              Copy-Item "deploy/systemd/uninstall-node-service.sh" "$bundleDir/"
              Copy-Item "deploy/systemd/neuro-node.service" "$bundleDir/"
            } else {
              Copy-Item "deploy/launchd/install-node-service.sh" "$bundleDir/"
              Copy-Item "deploy/launchd/uninstall-node-service.sh" "$bundleDir/"
              Copy-Item "deploy/launchd/com.neurostore.node.plist" "$bundleDir/"
            }
            
            # Create tarball
            # (Using shell for tar as it is more reliable for permissions)
            if ("${{ matrix.os }}" -eq "macos-latest") {
              # Bash handles this better on unix-alikes
              bash -c "chmod +x $bundleDir/* && tar -czvf dist/${{ matrix.asset_name }} -C $bundleDir ."
            } else {
              bash -c "chmod +x $bundleDir/* && tar -czvf dist/${{ matrix.asset_name }} -C $bundleDir ."
            }
          }

          $binaryHash = (Get-FileHash -Path "dist/${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          $binaryHash  ${{ matrix.asset_name }}
          "@ | Set-Content -Path "dist/${{ matrix.bundle_name }}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.bundle_name }}.build.json
            dist/${{ matrix.bundle_name }}.sha256
